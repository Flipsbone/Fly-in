[project]
name = "fly-in"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]

[tool.mypy]
exclude = [
    '^\\.venv/',
]

[tool.flake8]
exclude = [
    ".venv",
    ".git",
    "__pycache__"
]
